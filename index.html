<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Brazilian Business Greetings - 포르투갈어</title>
<style>
  :root{
    --bg:#f3f6ef; --card:#ffffff; --ink:#14301f; --sub:#5b6f63;
    --green:#0a7a3d; --gold:#f2b705; --blue:#123f7a; --line:#dfe7da;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    line-height:1.5;padding:0 0 40px}
  header{background:var(--green);color:#fff;padding:28px 20px 24px;border-bottom:6px solid var(--gold)}
  header h1{margin:0;font-size:22px;letter-spacing:-.02em}
  header p{margin:6px 0 0;font-size:14px;opacity:.9}
  main{max-width:560px;margin:0 auto;padding:16px}
  h2{font-size:16px;margin:26px 4px 10px;color:var(--blue)}
  .item{display:flex;align-items:center;gap:14px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:14px 14px 14px 16px;margin-bottom:10px}
  .txt{flex:1;min-width:0}
  .ko{font-size:13px;color:var(--sub)}
  .pt{font-size:24px;font-weight:700;margin:2px 0;word-break:keep-all}
  .pron{font-size:16px;color:var(--green);font-weight:600}
  .mean{font-size:13px;color:var(--sub);margin-top:2px}
  .play{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:var(--green);
    color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .12s, background .2s}
  .play:active{transform:scale(.92)}
  .play svg{width:26px;height:26px;fill:currentColor}
  .play.playing{background:var(--gold);color:var(--ink)}
  .play:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
  .combo{border-left:6px solid var(--gold)}
  .tip{background:#fff8dc;border:1px solid #f0dc8a;border-radius:12px;padding:14px 16px;
    font-size:14px;margin-top:18px}
  #note{display:none;margin:12px 4px;font-size:13px;color:#8a4b00}
  @media (prefers-reduced-motion:reduce){.play{transition:none}}
</style>
</head>
<body>
<header>
  <h1>브라질 비즈니스 인사</h1>
  <p>🔊 버튼을 누르면 브라질 포르투갈어 발음이 나옵니다</p>
</header>

<main>
  <div id="note">소리가 나지 않으면 휴대폰 무음 모드를 해제하고 볼륨을 올려 주세요. 브라우저에 브라질 포르투갈어 음성이 설치되어 있으면 더 자연스럽게 들립니다.</div>

  <h2>기본 인사</h2>
  <div id="basic"></div>

  <h2>실제 첫 만남에서는</h2>
  <div id="combo"></div>

  <div class="tip">
    상대방이 손을 내밀거나 명함을 주면서 인사할 때는
    <b>“Muito prazer!”</b>라고 웃으면서 말하는 것이 가장 간단하고 자연스럽습니다.
  </div>
</main>

<script>
const BASIC = [
  {ko:"아침", pt:"Bom dia!", pron:"봉 지아!", mean:"좋은 아침입니다."},
  {ko:"낮", pt:"Boa tarde!", pron:"보아 따르지!", mean:"좋은 오후입니다."},
  {ko:"저녁", pt:"Boa noite!", pron:"보아 노이치!", mean:"좋은 저녁입니다."},
  {ko:"안녕하세요", pt:"Olá!", pron:"올라!", mean:"안녕하세요."},
  {ko:"만나서 반갑습니다", pt:"Muito prazer!", pron:"무이뚜 프라제르!", mean:"만나서 반갑습니다."},
  {ko:"잘 지내세요?", pt:"Tudo bem?", pron:"투두 벵?", mean:"잘 지내세요?"},
  {ko:"감사합니다 (남성)", pt:"Obrigado!", pron:"오브리가두!", mean:"감사합니다."}
];
const COMBO = [
  {ko:"아침에 거래처 사람을 처음 만났다면", pt:"Bom dia! Muito prazer!", pron:"봉 지아! 무이뚜 프라제르!", mean:"좋은 아침입니다. 만나서 반갑습니다."},
  {ko:"낮에 처음 만났다면", pt:"Boa tarde! Muito prazer!", pron:"보아 따르지! 무이뚜 프라제르!", mean:"좋은 오후입니다. 만나서 반갑습니다."}
];

const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM13 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

let audio = null, activeBtn = null;

function stopAll(){
  if (audio){ audio.pause(); audio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (activeBtn){ activeBtn.classList.remove('playing'); activeBtn = null; }
}

function showNote(msg){ const n=document.getElementById('note'); n.textContent=msg; n.style.display='block'; }

function speakFallback(text, btn){
  showNote('지금 들리는 소리는 구글 번역 음성이 아니라 이 휴대폰의 내장 음성입니다. (구글 음성을 불러오지 못했습니다)');
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'pt-BR'; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace('_','-').toLowerCase() === 'pt-br');
  if (v) u.voice = v;
  u.onend = u.onerror = () => btn.classList.remove('playing');
  speechSynthesis.speak(u);
}

  // 구글 번역 음성 파일 재생 (주소를 순서대로 시도)
  function playAudioFile(text, btn){
    const q = encodeURIComponent(text);
    const urls = [
      'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=pt-BR&q=' + q,
      'https://translate.google.com/translate_tts?ie=UTF-8&client=gtx&tl=pt-BR&q=' + q,
      'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=pt&q=' + q
    ];
    let i = 0;
    const finish = () => { btn.classList.remove('playing'); if (activeBtn === btn) activeBtn = null; };
    const tryNext = () => {
      if (activeBtn !== btn) return;
      if (i >= urls.length){
        audio = null; finish();
        showNote('소리를 재생하지 못했습니다. 인터넷 연결과 무음 모드를 확인하거나, 크롬 또는 삼성 인터넷 브라우저에서 열어 주세요.');
        return;
      }
      const a = new Audio();
      a.referrerPolicy = 'no-referrer';
      a.src = urls[i++];
      audio = a;
      a.onended = finish;
      a.onerror = tryNext;
      a.play().catch(tryNext);
    };
    tryNext();
  }

  // 브라우저의 브라질 포르투갈어(pt-BR) 음성 사용
  function play(text, btn){
    const wasActive = (activeBtn === btn);
    stopAll();
    if (wasActive) return;

    activeBtn = btn;
    btn.classList.add('playing');
    document.getElementById('note').style.display = 'none';

    // 브라우저 음성 기능이 없거나(카톡 안 브라우저 등) 포르투갈어 음성이 없으면 구글 음성 파일로 재생
    const hasTTS = ('speechSynthesis' in window) && typeof SpeechSynthesisUtterance !== 'undefined';
    const hasPtVoice = hasTTS && speechSynthesis.getVoices().some(v => (v.lang || '').toLowerCase().replace('_','-').startsWith('pt'));
    if (!hasTTS || (speechSynthesis.getVoices().length > 0 && !hasPtVoice)){
      playAudioFile(text, btn);
      return;
    }

    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-BR';
    u.rate = 0.85;
    u.pitch = 1;

    const voices = speechSynthesis.getVoices();
    const voice = voices.find(v => (v.lang || '').toLowerCase() === 'pt-br')
               || voices.find(v => (v.lang || '').toLowerCase().startsWith('pt-br'))
               || voices.find(v => (v.lang || '').toLowerCase().startsWith('pt'));
    if (voice) u.voice = voice;

    u.onend = u.onerror = () => {
      btn.classList.remove('playing');
      if (activeBtn === btn) activeBtn = null;
    };

    speechSynthesis.speak(u);
  }

  function render(list, el, extra){
  const box = document.getElementById(el);
  list.forEach(d => {
    const row = document.createElement('div');
    row.className = 'item ' + (extra||'');
    row.innerHTML =
      '<div class="txt">' +
        '<div class="ko">' + d.ko + '</div>' +
        '<div class="pt">' + d.pt + '</div>' +
        '<div class="pron">' + d.pron + '</div>' +
        '<div class="mean">' + d.mean + '</div>' +
      '</div>';
    const b = document.createElement('button');
    b.className = 'play';
    b.type = 'button';
    b.setAttribute('aria-label', d.pt + ' 듣기');
    b.innerHTML = ICON_PLAY;
    b.addEventListener('click', () => play(d.pt, b));
    row.appendChild(b);
    box.appendChild(row);
  });
}
render(BASIC, 'basic');
render(COMBO, 'combo', 'combo');

if ('speechSynthesis' in window) speechSynthesis.getVoices();
</script>
</body>
</html>
